services:

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    expose:
      - 3000
    environment:
      NODE_ENV: production
    networks:
      - app-network
    restart: unless-stopped

  backend:
    build:
      context: ../backend
    expose:
      - 8000
    networks:
      - app-network
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend
    networks:
      - app-network
    restart: unless-stopped
    volumes:
      - ../nginx/nginx-http.conf:/etc/nginx/nginx.conf:ro

networks:
  app-network:
    driver: bridge
