services:

  # ── Next.js frontend ─────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
    networks:
      - app-network
    restart: unless-stopped

  # ── FastAPI ML backend (placeholder — replace with your actual image/build) ──
  backend:
    image: your-fastapi-backend:latest   # ← swap this
    # build:
    #   context: ./backend
    #   dockerfile: Dockerfile
    networks:
      - app-network
    restart: unless-stopped

  # ── Nginx reverse proxy ───────────────────────────────────────────────────────
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge
