<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mortgage Predictor</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <main class="card">
    <h1>Предсказание ипотеки</h1>
    <p class="hint">Сначала загрузите модель (.pkl), затем введите данные клиента.</p>

    <section>
      <h2>1. Модель</h2>
      <input type="file" id="modelFile" accept=".pkl" />
      <button type="button" id="uploadModelBtn">Загрузить модель</button>
      <p id="modelStatus" class="status"></p>
    </section>

    <section>
      <h2>2. Предсказание</h2>
      <form id="predictForm">
        <label>Credit score <input name="credit_score" type="number" value="720" required /></label>
        <label>Loan amount <input name="loan_amnt" type="number" value="10000" required /></label>
        <label>Loan rate (%) <input name="loan_int_rate" type="number" step="0.1" value="11.5" required /></label>
        <label>Person income <input name="person_income" type="number" value="80000" required /></label>
        <label>Loan % of income <input name="loan_percent_income" type="number" step="0.01" value="0.2" required /></label>
        <button type="submit">Получить предсказание</button>
      </form>
      <pre id="predictResult" class="result"></pre>
    </section>

    <section>
      <h2>3. CSV</h2>
      <input type="file" id="csvFile" accept=".csv" />
      <button type="button" id="predictCsvBtn">Предсказать из CSV</button>
      <pre id="csvResult" class="result"></pre>
    </section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
